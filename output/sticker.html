<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    -webkit-app-region: no-drag;
}

#sticker-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.poop-sticker {
    position: absolute;
    width: 56px;
    height: 56px;
    background-image: url('poop_icon.webp');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.92;
    filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.3));
    transform-origin: center center;
    animation: poopPopIn 0.25s cubic-bezier(.3, 1.4, .5, 1) both;
}

@keyframes poopPopIn {
    from { transform: scale(0.2) rotate(-30deg); opacity: 0; }
    to   { transform: scale(1) rotate(var(--rot, 0deg)); opacity: 0.92; }
}
</style>
</head>
<body>
<div id="sticker-layer"></div>
<script>
window.stickerAPI.onDropSticker(({ x, y, rotation, size }) => {
    const layer = document.getElementById('sticker-layer');
    if (!layer) return;
    const s = document.createElement('div');
    s.className = 'poop-sticker';
    const sz = size || 56;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.setProperty('--rot', (rotation || 0) + 'deg');
    s.style.left = Math.round(x - sz / 2) + 'px';
    s.style.top = Math.round(y - sz / 2) + 'px';
    layer.appendChild(s);
});

window.stickerAPI.onClearStickers(() => {
    const layer = document.getElementById('sticker-layer');
    if (!layer) return;
    while (layer.firstChild) layer.removeChild(layer.firstChild);
});
</script>
</body>
</html>
